<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Candorify · Your account</title>
  <meta name="description" content="Upload your itemized medical bill. Candorify marks what looks off and helps you ask about it." />
  <meta name="theme-color" content="#141813" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- mnm44: our 2 fonts, inter tight for everything + instrument serif for the fancy italic bits -->
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-view="account">
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- ================= HEADER ================= -->
  <header class="site-header">
    <div class="container header-bar">
      <button type="button" class="brand" data-go="home" aria-label="Candorify home">candorify</button>

      <nav class="public-nav" id="public-nav" aria-label="Main">
        <button type="button" class="nav-link hide-sm" data-auth="login">Log in</button>
        <button type="button" class="btn btn-primary btn-sm" data-auth="register">Sign up free</button>
      </nav>

      <nav class="app-nav" id="app-nav" aria-label="App" hidden>
        <button type="button" data-go="check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m9 14 2 2 4-4"/></svg>
          <span>Check a bill</span>
        </button>
        <button type="button" data-go="letters">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <span>Letters</span>
        </button>
        <button type="button" data-lookup>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Code lookup</span>
        </button>
        <button type="button" data-go="results">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
          <span>Results</span>
        </button>
        <button type="button" data-go="account" class="show-sm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <span>Account</span>
        </button>
      </nav>

      <div class="header-user" id="header-user" hidden>
        <span class="badge" id="plan-badge">Free</span>
        <button type="button" class="nav-link hide-sm" data-go="account">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <span id="user-email">Account</span>
        </button>
      </div>

      <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="site-menu">Menu</button>
    </div>
  </header>

  <main id="main">

    <!-- ================= ACCOUNT ================= -->
    <section id="view-account" class="view" aria-labelledby="account-title" hidden>
      <div class="container narrow">
        <h1 id="account-title" class="h2">Your account</h1>
        <div id="account-detail"><p class="muted">Loading…</p></div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="wide">
      <nav class="foot-nav" aria-label="Footer">
        <button type="button" data-go="home">Home</button><span aria-hidden="true"></span>
        <button type="button" data-scroll="why">Why it matters</button><span aria-hidden="true"></span>
        <button type="button" data-go="team">Our team</button><span aria-hidden="true"></span>
        <button type="button" data-go="results">Our results</button><span aria-hidden="true"></span>
        <button type="button" data-go="pricing">Pricing</button><span aria-hidden="true"></span>
        <button type="button" data-go="legal">Terms and Privacy</button>
      </nav>
      <svg class="foot-word" viewBox="0 0 1000 236" aria-hidden="true" focusable="false"><text x="0" y="180" textLength="1000" lengthAdjust="spacingAndGlyphs">candorify</text></svg>
      <p class="foot-cta"><button type="button" class="text-link" data-auth="register">Sign up free <span class="dot" aria-hidden="true"></span></button></p>
      <p class="disclaimer-text">Loading disclaimer…</p>
      <p class="foot-copy">© 2026 Candorify</p>
    </div>
  </footer>

  <!-- ================= MENU (full screen) ================= -->
  <!-- mnm44: data-when="in" only shows when logged in, "out" only when logged out, no data-when = always -->
  <div class="menu-backdrop" id="menu-backdrop" hidden></div>
  <nav class="site-menu" id="site-menu" aria-label="Menu" hidden>
    <div class="menu-head">
      <span class="brand">candorify</span>
      <button type="button" class="menu-btn" id="menu-close">Close</button>
    </div>
    <div class="menu-body">
      <ol class="menu-list">
        <li data-when="in"><button type="button" data-go="check">Check a bill</button></li>
        <li data-when="in"><button type="button" data-go="letters">Letters</button></li>
        <li data-when="in"><button type="button" data-lookup>Code lookup</button></li>
        <li data-when="out"><button type="button" data-go="home">Home</button></li>
        <li data-when="out"><button type="button" data-scroll="why">Why it matters</button></li>
        <li data-when="out"><button type="button" data-scroll="what-we-look-for">What we look for</button></li>
        <li data-when="out"><button type="button" data-scroll="how-it-works">How it works</button></li>
        <li><button type="button" data-go="team">Our team</button></li>
        <li><button type="button" data-founder>The founder</button></li>
        <li><button type="button" data-go="results">Our results</button></li>
        <li><button type="button" data-go="pricing">Pricing</button></li>
        <li><button type="button" data-go="legal">Terms and Privacy</button></li>
      </ol>
      <figure class="menu-preview" aria-hidden="true">
        <div class="menu-img" id="menu-img"></div>
        <figcaption><span id="menu-pnum">01</span><span id="menu-plabel">Home</span></figcaption>
      </figure>
    </div>
    <div class="menu-foot">
      <div data-when="out" class="menu-auth">
        <button type="button" class="btn btn-light" data-auth="register">Sign up free</button>
        <button type="button" class="text-link" data-auth="login">Log in</button>
      </div>
      <div data-when="in" class="menu-auth">
        <button type="button" class="text-link" data-go="account">Your account</button>
      </div>
      <p class="cap dim">Your time <span data-clock>--:--</span></p>
    </div>
  </nav>


  <!-- Terms -->
  <dialog id="terms-dialog" aria-labelledby="terms-title">
    <div class="dialog-head">
      <h2 id="terms-title" class="h3 no-margin">Terms and Privacy</h2>
      <button type="button" class="icon-btn" id="terms-close" aria-label="Close terms">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="dialog-body" id="terms-text"></div>
    <div class="dialog-foot"><button type="button" class="text-link" data-go="legal">Open the full page</button></div>
  </dialog>

  <div class="grain" aria-hidden="true"></div>
  <div class="scroll-progress" aria-hidden="true"><span id="scroll-bar"></span></div>

  <div id="toast" role="status" aria-live="polite"></div>

  <!-- mnm44: leave this empty on the website. the phone app swaps in the render link -->
  <script>window.CANDORIFY_API_BASE = "http://localhost:8000";</script>
  <script src="assets/js/api.js"></script>
  <script src="main.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
