# Render Blueprint: one web service (FastAPI backend) + one PostgreSQL database.
# Render -> New -> Blueprint -> pick this repo. Secrets are generated by Render, never committed.
services:
  - type: web
    name: candorify-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: Render ends HTTPS and forwards the original scheme; the app uses it to redirect http -> https
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true            # random secret created by Render
      - key: DATABASE_URL
        fromDatabase:
          name: candorify-db
          property: connectionString
      - key: CORS_ORIGINS               # add the web frontend's https:// address here once it is deployed
        value: '["http://tauri.localhost","tauri://localhost","http://localhost:1420"]'
      - key: RETENTION_DAYS
        value: "30"
      - key: GEMINI_API_KEY             # paste the team's key in the Render dashboard (never commit it)
        sync: false
      - key: DOCS_ENABLED               # on for the midterm demo; set to "false" afterwards
        value: "true"

databases:
  - name: candorify-db
    plan: free
    databaseName: candorify
    user: candorify